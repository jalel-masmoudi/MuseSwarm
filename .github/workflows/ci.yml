name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for f in src/*.js; do node --check "$f"; done
      - name: Unit, API and end-to-end tests (offline)
        run: npm test

  studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: museswarm-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: museswarm-studio/package-lock.json
      - run: npm ci
      - run: npm run build
