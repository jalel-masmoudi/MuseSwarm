<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sprint Priority Engine</title><style>body{margin:0;font-family:system-ui;background:#0f1115;color:#e6e6e6}header{padding:16px;background:#1a1d24}main{padding:16px;max-width:900px;margin:auto}.card{background:#1e222c;padding:12px;border-radius:8px;margin:8px 0}input,button{padding:6px;border-radius:6px;border:1px solid #333;background:#111;color:#eee}button{cursor:pointer;background:#4f46e5;border:none}.breach{border-left:4px solid #ef4444}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}</style></head><body><header><h2>Sprint & Incident Priority Engine</h2></header><main><div class="grid"><input id="title" placeholder="Title"><input id="impact" type="number" min="1" max="10" value="5"><input id="urgency" type="number" min="1" max="10" value="5"><input id="effort" type="number" min="1" max="10" value="5"></div><button onclick="add()">Add Task</button><div id="list"></div></main><script src="app.js"></script><script>let tasks=[];function add(){tasks.push(AppCore.createTask({title:title.value,impact:+impact.value,urgency:+urgency.value,effort:+effort.value}));render()}function render(){const r=AppCore.rank(tasks);list.innerHTML=r.map(t=>`<div class="card ${t.breached?'breach':''}"><b>${t.title}</b> - ${t.priority} (${t.score}) ${t.breached?'SLA BREACH':''}<br><small>Deadline: ${t.deadline.toLocaleString()}</small></div>`).join('')}</script></body></html>
