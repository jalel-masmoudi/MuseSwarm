<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flag Controller</title><style>*{box-sizing:border-box}body{margin:0;background:#0f1117;color:#e6e6e6;font-family:sans-serif;display:grid;grid-template-rows:auto 1fr}header{display:flex;justify-content:space-between;padding:12px 16px;background:#1a1d27}table{width:100%;border-collapse:collapse}th,td{border:1px solid #2a2e42;padding:6px;font-size:13px}.bar{height:8px;background:#2a2e42;border-radius:4px;overflow:hidden}.fill{height:100%;background:#6c5ce7}input,select,button{padding:6px;border-radius:6px;border:1px solid #333;background:#1e2130;color:#eee}button{cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;padding:12px}.panel{background:#1a1d27;border-radius:8px;padding:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><header><b>Flag Controller</b><button onclick="AppCore.resetAll();render()">Reset All</button></header><div class="grid"><div class="panel"><h3>Flags</h3><table><thead><tr><th>Key</th><th>%</th><th>Status</th><th>Actions</th></tr></thead><tbody id="flagTable"></tbody></table></div><div class="panel"><h3>Create / Rollout</h3><input id="fkey" placeholder="key"><input id="fname" placeholder="name"><input id="fpct" type="number" placeholder="%" value="10"><input id="fthr" type="number" placeholder="threshold" value="5"><button onclick="create()">Create</button><hr><label>Rollout <span id="pctLabel">10%</span></label><input id="slider" type="range" min="0" max="100" value="10" oninput="pctLabel.textContent=this.value+'%'"><div><button onclick="step(1)">+1%</button><button onclick="step(5)">+5%</button><button onclick="step(10)">+10%</button><button onclick="step(25)">+25%</button><button onclick="applySlider()">Apply</button></div><select id="selFlag"></select></div><div class="panel"><h3>Evaluator</h3><input id="evalUser" placeholder="userId" value="user123"><button onclick="evalFlag()">Evaluate</button><div id="evalOut"></div><hr><h3>Metrics & Breaker</h3><div id="metrics"></div><button onclick="simulate(false)">Record OK</button><button onclick="simulate(true)">Record Error</button><div id="breaker"></div></div></div><div class="panel" style="margin:12px"><h3>Audit Log</h3><div id="audit" style="max-height:200px;overflow:auto;font-size:12px"></div></div><script src="app.js"></script><script>function render(){let flags=AppCore.listFlags();flagTable.innerHTML=flags.map(f=>`<tr><td>${f.key}</td><td><div class=bar><div class=fill style="width:${f.percentage}%"></div></div>${f.percentage}%</td><td>${f.status}</td><td><button onclick="delFlag('${f.key}')">Del</button></td></tr>`).join('');selFlag.innerHTML=flags.map(f=>`<option value="${f.key}">${f.key}</option>`).join('');updateMetrics();renderAudit();}function create(){try{AppCore.createFlag({key:fkey.value,name:fname.value,percentage:+fpct.value,threshold:+fthr.value});render();}catch(e){alert(e.message)}}function delFlag(k){AppCore.deleteFlag(k);render();}function step(n){let k=selFlag.value;if(!k)return;let f=AppCore.getFlag(k);AppCore.setRolloutPercentage(k,Math.min(100,f.percentage+n));render();}function applySlider(){let k=selFlag.value;if(!k)return;AppCore.setRolloutPercentage(k,+slider.value);render();}function evalFlag(){let k=selFlag.value;if(!k)return;let r=AppCore.evaluateFlag(k,evalUser.value);evalOut.textContent=`bucket:${r.bucket} enabled:${r.enabled} reason:${r.reason} %:${r.percentage}`;}function simulate(isErr){let k=selFlag.value;if(!k)return;AppCore.recordRequest(k,evalUser.value,isErr);updateMetrics();renderAudit();}function updateMetrics(){let k=selFlag.value;if(!k){metrics.textContent='-';breaker.textContent='-';return;}let m=AppCore.getMetrics(k);metrics.textContent=`total:${m.total} errors:${m.errors} rate:${(m.errorRate*100).toFixed(1)}% thr:${m.threshold}%`;let cb=AppCore.checkCircuitBreaker(k);breaker.textContent=cb.tripped?'OPEN':'CLOSED';breaker.style.color=cb.tripped?'#ff6b6b':'#51cf66';}function renderAudit(){let logs=AppCore.getAuditLog();audit.innerHTML=logs.slice(-50).reverse().map(a=>`<div>${new Date(a.ts).toLocaleTimeString()} ${a.flagKey} ${a.action} ${a.from}->${a.to} ${a.reason}</div>`).join('');}render();</script></body></html>
